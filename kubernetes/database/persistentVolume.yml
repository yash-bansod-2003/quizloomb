apiVersion: v1
kind: PersistentVolume
metadata:
  name: quizloom-database-pv
  namespace: quizloom
  labels:
    app: quizloom-database

spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /data
